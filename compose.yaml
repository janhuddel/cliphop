# Beispiel-Service zum Einfügen in den bestehenden Docker-Compose-Stack.
# Läuft auch allein (ohne Traefik) — die Labels werden dann einfach ignoriert.
name: cliphop

services:
  cliphop:
    image: oci.rohwer.sh/cliphop:1.0.0
    restart: unless-stopped
    environment:
      CLIPHOP_TTL: 24h
      CLIPHOP_MAX_ITEMS: "50"
      CLIPHOP_DB: /data/cliphop.db
      BASE_URL: https://cliphop.rohwer.sh
    volumes:
      # Lokales Docker-Volume, bewusst KEIN NFS-Bind-Mount: SQLite braucht
      # zuverlaessige Dateilocks (WAL). Siehe docs/DEPLOYMENT.md.
      - cliphop-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').read() == b'ok' else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.cliphop.rule=Host(`cliphop.rohwer.sh`)
      - traefik.http.services.cliphop.loadbalancer.server.port=8000
      # Bewusst keine compress-/buffering-Middleware auf diesem Router (SSE, siehe docs/DEPLOYMENT.md).

volumes:
  # Liegt auf der lokalen Platte des Docker-Hosts, nicht auf dem NFS-Mount.
  cliphop-data:
