[project]
name = "cliphop"
version = "1.0.0"
description = "Kurze Textnotizen zwischen Geräten im Heimnetz austauschen"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
cliphop = "cliphop.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cliphop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
